name: Bug report
description: Report a reproducible KEEL problem without including private data
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, financial records, or identifying screenshots. Report security issues through the repository Security tab.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and why it is incorrect.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest sequence that reproduces the issue using fictional data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision or deployment
      description: Commit SHA, branch, or hosted version if known.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, financial data, and identifying screenshots.
          required: true
