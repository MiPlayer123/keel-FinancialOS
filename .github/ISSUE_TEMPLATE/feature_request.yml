name: Feature request
description: Propose a focused product or developer improvement
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need is not met today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result without prescribing an implementation.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Ledger and transactions
        - Accounts and connections
        - Budgets, recurring, or goals
        - Receipts, statements, or reconciliation
        - Reports and exports
        - Assistant and automation
        - Web experience
        - Developer experience
        - Other
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Financial or privacy considerations
      description: Note any correctness, authorization, reversibility, or data-handling implications.
