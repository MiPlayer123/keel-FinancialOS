name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: typecheck + lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Mechanical harness gates (docs/harness/README.md): pure packages stay
      # SDK-free; every api route is UI-reachable or allowlisted with a reason.
      - name: harness gates (purity + UI reachability + capability boundary)
        run: |
          node scripts/harness/verify-purity.mjs
          node scripts/harness/verify-reachability.mjs
          node scripts/check-capability-boundary.mjs
      # worker vitest + deno suites import the generated vendor bundle
      # (git-ignored) — build it or the suites die at import time.
      - run: pnpm build:functions
      - run: pnpm test
      - name: ledger coverage gate (100%)
        run: pnpm --filter @keel/ledger test

  database:
    name: migrations + pgTAP + double-reset convergence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      # config.toml declares four edge functions, so `supabase start` bundles
      # them and hard-fails on the git-ignored generated vendor bundle
      # (_shared/vendor/keel-domain.mjs). It MUST be built first.
      - run: pnpm build:functions
      - name: start stack
        run: supabase start
      - name: reset (migrations + seed)
        run: supabase db reset
      - name: pgTAP suites
        run: supabase test db
      - name: double-reset schema convergence (PLAN 3.6.13)
        run: |
          supabase db dump --local -f /tmp/schema-a.sql
          supabase db reset
          supabase db dump --local -f /tmp/schema-b.sql
          diff /tmp/schema-a.sql /tmp/schema-b.sql

  integration:
    name: edge functions + replay integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      # Must precede `supabase start`: starting the stack bundles the edge
      # functions declared in config.toml, which import this generated
      # (git-ignored) vendor bundle.
      - run: pnpm build:functions
      - run: supabase start
      # provision:local aliases the RUNNING stack's key as the automations
      # secret, so it must come after `supabase start` (it hard-fails cold).
      - run: pnpm provision:local
      - run: supabase db reset
      - name: serve functions
        # Warm up EVERY function, not just one: each function boots its own
        # edge worker, so webhook-provider being ready says nothing about api —
        # the first test to hit a cold function raced its boot and flaked a
        # transient 404 on main (runs 29552336466 / 29553427394, both green on
        # their PRs). Readiness = all four /health endpoints answer 200.
        # "Warm" means the function's worker EXECUTED a request — some /health
        # routes sit behind auth wrappers (api returns 401 unauthenticated), so
        # any definitive HTTP answer except 404 counts. 404 is exactly the
        # cold-boot symptom we are guarding against; 000/5xx are gateway
        # not-ready. (curl -sf treated the 401 as failure and killed run
        # 29556666882 — the fix that broke the fix.)
        run: |
          supabase functions serve --env-file supabase/functions/.env &
          for fn in api worker webhook-provider scheduled; do
            ok=0
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:55321/functions/v1/${fn}/health" || echo 000)
              case "$code" in
                2*|400|401|403|405) ok=1; break;;
              esac
              sleep 2
            done
            if [ "$ok" != "1" ]; then
              echo "::error::function ${fn} never answered (last code ${code})"; exit 1
            fi
          done
          # /health was not enough. Run 33420152390 warmed all four /health
          # endpoints, then still took a 404 on the FIRST /api/commands of the
          # suite (02-commands.test.ts:49) — the third time this flake has hit
          # main after passing on the PR, and this time it skipped the function
          # deploy and left production without the merged route.
          #
          # So warm the exact paths the suite actually calls, not a liveness
          # route that can answer while the real routing table is still coming
          # up. Same accept-set as above; 404 is the symptom and keeps waiting.
          for path in api/commands api/queries; do
            ok=0
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                -H 'content-type: application/json' -d '{}' \
                "http://127.0.0.1:55321/functions/v1/${path}" || echo 000)
              case "$code" in
                2*|400|401|403|405) ok=1; break;;
              esac
              sleep 2
            done
            if [ "$ok" != "1" ]; then
              echo "::error::route ${path} never routed (last code ${code})"; exit 1
            fi
          done
      - run: pnpm test:integration

  secrets:
    name: secret scan (tracked files + built bundle)
    runs-on: ubuntu-latest
    # gitleaks-action's pull_request mode lists the PR's commits via the API;
    # without an explicit pull-requests:read grant the default token 403s.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build web bundle and scan output (TASK-000 test 12 "bundled")
        run: |
          pnpm --filter @keel/web build || exit 1
          ! grep -rE "sb_secret_[A-Za-z0-9]|PLAID_SECRET|service_role" apps/web/.next/static 2>/dev/null
