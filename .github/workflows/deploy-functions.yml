name: deploy-functions

# Edge functions don't auto-deploy the way migrations do (the Supabase GitHub
# integration applies supabase/migrations on merge, but api/worker were going
# stale). This deploys the four functions whenever their source changes on
# main. Requires the SUPABASE_ACCESS_TOKEN repository secret (Supabase
# dashboard → Account → Access Tokens); the project ref is public config.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'packages/**'
      - 'scripts/build-functions.mjs'

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      # The functions import a generated vendor bundle (git-ignored).
      - run: pnpm build:functions
      - name: deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set — add it in repo Settings → Secrets to enable function deploys."
            exit 1
          fi
          supabase functions deploy api worker webhook-provider scheduled \
            --project-ref yrbteeownwjhcushwaga
