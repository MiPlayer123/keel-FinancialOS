name: deploy-functions

# Edge functions don't auto-deploy the way migrations do (the Supabase GitHub
# integration applies supabase/migrations on merge, but api/worker were going
# stale). This deploys the four functions whenever their source changes on
# main. Requires the SUPABASE_ACCESS_TOKEN repository secret (Supabase
# dashboard → Account → Access Tokens); the project ref is public config.

on:
  # Gate on CI: deploy only after the ci workflow SUCCEEDS on main. A direct
  # push trigger would race CI and could ship a red commit to prod functions.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  # A red CI on main used to leave this workflow "skipped", which GitHub shows
  # quietly and nobody notices. That is how PR #179 shipped: the merge landed,
  # a known-flaky integration test failed on main, the deploy silently did not
  # run, and production kept serving an api function with no /tags/set-business
  # route while the database and the web app had already moved on. The feature
  # 404'd for the user with no signal anywhere that a deploy had been skipped.
  #
  # main and production drifting apart is exactly the thing that must never be
  # quiet, so a skipped deploy is now a FAILED run on main instead of a skipped
  # one. It costs a red X on an already-red main, which is the point.
  guard:
    if: github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: report the skipped deploy
        run: |
          echo "::error::CI concluded '${{ github.event.workflow_run.conclusion }}' on main, so the edge functions were NOT deployed. main and production are now out of sync: migrations apply through the Supabase integration but api/worker/webhook-provider/scheduled do not. Fix CI on main and re-run it (re-running the failed jobs is enough — this workflow fires again on completion), or deploy by hand: pnpm build:functions && supabase functions deploy api worker webhook-provider scheduled --project-ref yrbteeownwjhcushwaga"
          exit 1

  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      # The functions import a generated vendor bundle (git-ignored).
      - run: pnpm build:functions
      - name: deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set — add it in repo Settings → Secrets to enable function deploys."
            exit 1
          fi
          supabase functions deploy api worker webhook-provider scheduled \
            --project-ref yrbteeownwjhcushwaga
      - name: record what shipped
        run: |
          echo "Deployed api, worker, webhook-provider, scheduled to yrbteeownwjhcushwaga" >> "$GITHUB_STEP_SUMMARY"
          echo "from commit ${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Verify: the Edge Functions list in the Supabase dashboard should show a bumped version for all four." >> "$GITHUB_STEP_SUMMARY"
