name: apply-migration

# Manually apply merged migration files to the live project, in order. Use it
# when live-schema-drift reports a migration that merged but never reached
# production. Manual on purpose: some older migrations are not safe to re-run
# (CREATE POLICY, renames), so nothing applies automatically.
#
# Runs from main only, so only reviewed migrations can reach production. When it
# finishes, live-schema-drift runs again and shows whether production now matches.

on:
  workflow_dispatch:
    inputs:
      migrations:
        description: 'File names in supabase/migrations, space separated, applied in this order (e.g. 20260828011000_notes_tasks_export.sql)'
        required: true
        type: string

concurrency:
  group: apply-migration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: apply to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # Passed through env, never interpolated into the script, so the
          # input cannot inject shell. The script also rejects anything that is
          # not a plain migration file name.
          MIGRATIONS: ${{ inputs.migrations }}
        run: |
          set -f  # split on spaces, but never expand globs
          # shellcheck disable=SC2086 -- word splitting on file names is intended
          node scripts/db/apply-migration.mjs --project-ref yrbteeownwjhcushwaga $MIGRATIONS
          {
            echo "## Applied to production"
            for m in $MIGRATIONS; do echo "- \`$m\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
